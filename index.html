<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- Lets the game run full-screen with no browser chrome when saved to
       the home screen, and tints the status bar/browser UI to match the
       game's own warm palette instead of the default black or white. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <!-- The standard equivalent of the line above; Safari still reads the
       Apple-prefixed one, but browsers now warn that it's deprecated, so
       both are present rather than dropping support for either. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#FFD9A8" />

  <title>Secret Island</title>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/scenes.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- The single root element. All scenes live inside this "island" -->
  <!-- so that transitions feel like moving around one place, not swapping screens. -->
  <div id="app" class="app">

    <!-- ================= ISLAND SCENE ================= -->
    <!-- The island is a place, not a menu. Five layers, back to front: -->
    <!-- far background -> mid-ground (sea) -> island -> foreground -> UI. -->
    <section id="scene-island" class="scene scene--island is-active" aria-label="Острів">

      <!-- LAYER 1: far background — almost still, sets the mood -->
      <div class="layer layer--far-bg">
        <div class="sky">
          <div class="sun"></div>

          <!-- A slow warmth/brightness drift on top of whatever the current
               day-stage's base colors are (see .day-stage--* below) — the
               island genuinely moves from morning to night as adventures
               are finished, this is just the extra "never sits still"
               shimmer layered on top of that. -->
          <div class="sky-mood"></div>

          <!-- Stars + moon + moon-path — invisible except during the
               night stage (after all three adventures are done). -->
          <svg class="island-stars" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
            <circle class="island-star" cx="30" cy="20" r="1.2" fill="var(--color-starlight)" style="animation-delay:0s" />
            <circle class="island-star" id="memory-star-lagoon" cx="70" cy="40" r="1" fill="var(--color-starlight)" style="animation-delay:0.6s" />
            <circle class="island-star" cx="110" cy="15" r="1.4" fill="var(--color-starlight)" style="animation-delay:1.2s" />
            <circle class="island-star" cx="150" cy="35" r="1" fill="var(--color-starlight)" style="animation-delay:1.8s" />
            <circle class="island-star" id="memory-star-mountain" cx="190" cy="18" r="1.3" fill="var(--color-starlight)" style="animation-delay:2.4s" />
            <circle class="island-star" cx="230" cy="45" r="1" fill="var(--color-starlight)" style="animation-delay:0.3s" />
            <circle class="island-star" cx="260" cy="22" r="1.4" fill="var(--color-starlight)" style="animation-delay:1.5s" />
            <circle class="island-star" id="memory-star-bazaar" cx="45" cy="60" r="0.9" fill="var(--color-starlight)" style="animation-delay:2.1s" />
            <circle class="island-star" cx="130" cy="65" r="0.9" fill="var(--color-starlight)" style="animation-delay:0.9s" />
            <!-- a faint Milky Way-ish band -->
            <ellipse cx="150" cy="35" rx="140" ry="10" fill="var(--color-starlight)" opacity="0.05" />
          </svg>
          <svg class="island-moon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="20" cy="20" r="16" fill="#F3EEDD" />
            <circle cx="26" cy="15" r="3" fill="#E3DCC4" opacity="0.6" />
            <circle cx="16" cy="25" r="2" fill="#E3DCC4" opacity="0.5" />
          </svg>
          <div class="moon-path"></div>

          <!-- Soft warm light rays, low behind the clouds -->
          <svg class="light-rays" viewBox="0 0 300 200" preserveAspectRatio="none" aria-hidden="true">
            <path d="M 210 0 L 300 0 L 250 200 L 190 200 Z" fill="var(--color-light-ray)" opacity="0.14" />
            <path d="M 240 0 L 300 40 L 270 200 L 230 200 Z" fill="var(--color-light-ray)" opacity="0.1" />
          </svg>

          <!-- A few dust motes catching the sunlight -->
          <span class="sky-dust sky-dust--1"></span>
          <span class="sky-dust sky-dust--2"></span>
          <span class="sky-dust sky-dust--3"></span>

          <!-- Fireflies, only out at night -->
          <span class="firefly firefly--1"></span>
          <span class="firefly firefly--2"></span>
          <span class="firefly firefly--3"></span>

          <!-- Clouds in three sizes, all drifting at their own slow pace -->
          <div class="cloud cloud--1"></div>
          <div class="cloud cloud--2"></div>
          <div class="cloud cloud--3"></div>
          <div class="cloud cloud--4"></div>
          <div class="cloud cloud--5"></div>
        </div>

        <!-- The sea's furthest band: almost still, muted, just enough
             shimmer to read as water rather than a flat horizon line. -->
        <div class="sea-far">
          <span class="sea-far__shimmer"></span>
        </div>

        <div class="distant-island distant-island--1"></div>
        <div class="distant-island distant-island--2"></div>

        <!-- A tiny ship silhouette on the horizon — the world keeps going
             past the edge of the screen, not just the two nearby islands. -->
        <svg class="distant-ship" viewBox="0 0 24 12" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M2 9 L22 9 L19 12 L5 12 Z" fill="var(--color-sea-deep)" opacity="0.4" />
          <line x1="12" y1="2" x2="12" y2="9" stroke="var(--color-sea-deep)" stroke-width="1" opacity="0.4" />
          <path d="M12 2 L18 8 L12 8 Z" fill="var(--color-sea-deep)" opacity="0.4" />
        </svg>
      </div>

      <!-- LAYER 2: mid-ground — sea, waves, boat, gulls -->
      <div class="layer layer--mid">
        <div class="sea">
          <div class="wave wave--back"></div>
          <div class="wave wave--mid"></div>
          <div class="wave wave--front"></div>
          <!-- Sunlight glinting on the water: thin highlights that drift
               across and fade, never in the same place twice in a row. -->
          <span class="water-glint water-glint--1"></span>
          <span class="water-glint water-glint--2"></span>
        </div>
        <div class="boat" id="boat">
          <svg class="boat__svg" viewBox="0 0 50 46" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M 6 32 Q 25 40, 44 32 L 38 40 Q 25 44, 12 40 Z" fill="#C98A4B" stroke="#A5692F" stroke-width="1.5" />
            <line x1="25" y1="32" x2="25" y2="4" stroke="#8A5A3B" stroke-width="2" stroke-linecap="round" />
            <path d="M 25 6 L 25 28 L 6 28 Z" fill="var(--color-starlight)" stroke="#E3C083" stroke-width="1" />
            <path d="M 25 10 L 25 28 L 40 26 Z" fill="#FF9F6B" opacity="0.9" />
          </svg>
        </div>
        <svg class="gull gull--1" viewBox="0 0 24 10" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M 0 8 Q 6 0, 12 8 Q 18 0, 24 8" fill="none" stroke="#3A3A3A" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <svg class="gull gull--2" viewBox="0 0 24 10" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M 0 8 Q 6 0, 12 8 Q 18 0, 24 8" fill="none" stroke="#3A3A3A" stroke-width="1.6" stroke-linecap="round" />
        </svg>

        <!-- The island's own mountain range — the ridge the Mountain
             adventure climbs, visible from the beach. Three depth tiers:
             far peaks (hazy), mid ridge, and a rocky near ridge in front. -->
        <svg class="mountains" viewBox="0 0 400 130" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
          <!-- far: hazy, low-contrast, sets the horizon -->
          <path d="M0 130 L58 46 L104 130 Z" fill="var(--color-rock-far)" opacity="0.55" />
          <path d="M250 130 L316 52 L378 130 Z" fill="var(--color-rock-far)" opacity="0.55" />

          <!-- mid: the main ridge, most of the visual weight -->
          <path d="M78 130 L150 30 L222 130 Z" fill="var(--color-rock-mid)" opacity="0.75" />
          <path d="M120 130 L196 18 L272 130 Z" fill="var(--color-palm-dark)" />
          <path d="M196 18 L232 70 L196 60 L172 78 Z" fill="var(--color-rock-fog)" opacity="0.85" />

          <!-- fog: a soft band sitting in the saddle between peaks -->
          <path d="M40 100 Q 140 80, 240 96 T 400 92 L400 118 L0 118 Z" fill="var(--color-rock-fog)" opacity="0.3" />

          <!-- near: a low rocky ridge closest to the beach, most saturated -->
          <path d="M196 18 L272 130 L228 130 Z" fill="var(--color-rock-near)" opacity="0.6" />
          <path d="M0 130 L40 108 L86 128 L20 130 Z" fill="var(--color-rock-near)" opacity="0.5" />
          <path d="M340 130 L380 104 L400 118 L400 130 Z" fill="var(--color-rock-near)" opacity="0.5" />
        </svg>
      </div>

      <!-- LAYER 3: the island itself — where the adventure lives -->
      <div class="layer layer--island">
        <div class="land">

          <!-- A soft, moving shadow patch as if a cloud above is passing
               over — ties the sky layer and the land layer into one
               place instead of two independent backdrops. -->
          <span class="cloud-shadow cloud-shadow--1"></span>
          <span class="cloud-shadow cloud-shadow--2"></span>

          <!-- A rare passing overcast: for a few seconds the sun goes
               behind a cloud, the whole island cools slightly and the
               shadows soften. Nothing else in the game acknowledges
               weather at all, which is what makes the island read as a
               picture rather than a place. -->
          <div class="overcast-veil" id="overcast-veil"></div>

          <!-- Shoreline transition: foam right at the water's edge, then
               wet sand, then dry sand further up the beach. -->
          <svg class="foam-edge" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 6 Q 50 0, 100 7 T 200 5 T 300 8 T 400 4 L400 20 Q 300 26, 200 20 T 100 22 T 0 18 Z"
                  fill="var(--color-foam)" opacity="0.8" />
          </svg>

          <!-- Dunes: the shoreline isn't a clean arc, and the sand has
               a little shape to it rather than being one flat colour.
               Wet sand near the water, dry sand further inland. -->
          <svg class="dunes" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 26 Q 60 8, 130 20 T 260 14 T 400 24 L400 120 L0 120 Z" fill="var(--color-sand-wet)" />
            <path d="M0 52 Q 90 36, 180 50 T 400 44 L400 120 L0 120 Z" fill="var(--color-sand)" opacity="0.9" />
            <path d="M0 86 Q 120 72, 240 84 T 400 78 L400 120 L0 120 Z" fill="var(--color-sand-dark)" opacity="0.6" />
          </svg>

          <!-- Pebbles and shells scattered on the beach -->
          <svg class="pebbles" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
            <ellipse cx="46" cy="72" rx="7" ry="4" fill="#D9B77C" />
            <ellipse cx="118" cy="96" rx="5" ry="3" fill="#CFA96C" />
            <ellipse cx="212" cy="66" rx="6" ry="3.5" fill="#D9B77C" />
            <ellipse cx="300" cy="100" rx="8" ry="4" fill="#CFA96C" />
            <ellipse cx="356" cy="70" rx="5" ry="3" fill="#D9B77C" />
            <ellipse cx="168" cy="110" rx="6" ry="3" fill="#CFA96C" />
          </svg>

          <!-- Baseline decoration: small props that are always here, not
               tied to progress (see .growth below for the ones that are).
               These are what make the island feel lived-in rather than
               empty — none of them do anything when tapped. -->

          <!-- Rock cluster -->
          <svg class="prop prop--rocks" viewBox="0 0 70 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="20" cy="26" rx="18" ry="11" fill="var(--color-rock-stone)" stroke="var(--color-rock-near)" stroke-width="2" />
            <ellipse cx="46" cy="22" rx="13" ry="9" fill="var(--color-rock-stone)" stroke="var(--color-rock-near)" stroke-width="2" opacity="0.9" />
            <ellipse cx="58" cy="28" rx="9" ry="6" fill="var(--color-rock-stone)" stroke="var(--color-rock-near)" stroke-width="1.5" opacity="0.85" />
          </svg>

          <!-- Tree stump, with a couple of rings showing on top -->
          <svg class="prop prop--stump" viewBox="0 0 44 38" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="22" cy="34" rx="20" ry="6" fill="var(--color-shadow-soft)" />
            <rect x="8" y="10" width="28" height="22" rx="3" fill="var(--color-wood-dark)" />
            <ellipse cx="22" cy="10" rx="14" ry="6" fill="var(--color-wood-light)" stroke="var(--color-wood-dark)" stroke-width="2" />
            <ellipse cx="22" cy="10" rx="8" ry="3.4" fill="none" stroke="var(--color-wood-dark)" stroke-width="1.4" opacity="0.7" />
          </svg>

          <!-- Shell cluster: purely decorative, distinct from the tappable secret shell -->
          <svg class="prop prop--shells" viewBox="0 0 50 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 22c6 0 10-6 10-11S18 2 12 2 2 6 2 11s4 11 10 11z" fill="var(--color-foam)" stroke="var(--color-sand-dark)" stroke-width="1.5" />
            <path d="M12 4v18M6 6l2 15M18 6l-2 15" stroke="var(--color-sand-dark)" stroke-width="1" />
            <path d="M34 24c5 0 8-4 8-8s-3-8-8-8-8 4-8 8 3 8 8 8z" fill="#FFE3C7" stroke="var(--color-sand-dark)" stroke-width="1.5" />
            <path d="M34 9v15M29 11l2 12M39 11l-2 12" stroke="var(--color-sand-dark)" stroke-width="0.8" />
          </svg>

          <!-- A small barrel, washed up or just left behind -->
          <svg class="prop prop--barrel" viewBox="0 0 36 42" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="18" cy="39" rx="15" ry="4" fill="var(--color-shadow-soft)" />
            <path d="M4 10 Q18 2 32 10 L29 34 Q18 40 7 34 Z" fill="var(--color-wood-light)" stroke="var(--color-wood-dark)" stroke-width="2" />
            <path d="M4 10 Q18 16 32 10" fill="none" stroke="var(--color-wood-dark)" stroke-width="2.5" />
            <path d="M5.5 20 Q18 26 30.5 20" fill="none" stroke="var(--color-wood-dark)" stroke-width="2.5" />
            <path d="M7 30 Q18 35 29 30" fill="none" stroke="var(--color-wood-dark)" stroke-width="2.5" />
          </svg>

          <!-- A standing lantern, unlit but warm-toned to match the world -->
          <svg class="prop prop--lantern" viewBox="0 0 30 50" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="15" cy="48" rx="10" ry="2.5" fill="var(--color-shadow-soft)" />
            <rect x="13" y="20" width="4" height="26" fill="var(--color-wood-dark)" />
            <path d="M8 8h14l-2 14H10z" fill="var(--color-box-glow)" stroke="var(--color-wood-dark)" stroke-width="2" opacity="0.9" />
            <path d="M6 8h18l-2-4H8z" fill="var(--color-wood-dark)" />
            <circle cx="15" cy="4" r="2" fill="var(--color-wood-dark)" />
          </svg>

          <!-- A nautical life ring, propped against nothing in particular -->
          <svg class="prop prop--life-ring" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="20" cy="20" r="17" fill="none" stroke="var(--color-text-light)" stroke-width="7" />
            <circle cx="20" cy="20" r="17" fill="none" stroke="var(--color-sun)" stroke-width="7" stroke-dasharray="13 13" />
            <circle cx="20" cy="20" r="17" fill="none" stroke="var(--color-wood-dark)" stroke-width="1.5" />
          </svg>

          <!-- A blank wooden signpost — decoration, not a real UI sign -->
          <svg class="prop prop--signpost" viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="20" cy="53" rx="8" ry="2.5" fill="var(--color-shadow-soft)" />
            <rect x="17" y="14" width="6" height="40" fill="var(--color-wood-dark)" />
            <rect x="2" y="8" width="26" height="12" rx="2" fill="var(--color-wood-light)" stroke="var(--color-wood-dark)" stroke-width="2" transform="rotate(-4 15 14)" />
          </svg>

          <!-- Small flower cluster, always here (separate from the flowers
               that appear with progress in .growth) -->
          <svg class="prop prop--flowers" viewBox="0 0 46 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 24V14 M22 24V10 M35 24V16" stroke="var(--color-palm-dark)" stroke-width="2.5" stroke-linecap="round" fill="none" />
            <circle cx="8" cy="10" r="5" fill="var(--color-flower-1)" />
            <circle cx="22" cy="6" r="5.5" fill="var(--color-flower-2)" />
            <circle cx="35" cy="12" r="4.5" fill="var(--color-flower-3)" />
          </svg>

          <!-- An old, closed map — decoration, not the real intro scroll -->
          <svg class="prop prop--old-map" viewBox="0 0 50 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <ellipse cx="25" cy="29" rx="20" ry="3" fill="var(--color-shadow-soft)" />
            <rect x="4" y="8" width="42" height="16" rx="8" fill="#EBD5A6" stroke="var(--color-wood-dark)" stroke-width="1.5" transform="rotate(-3 25 16)" />
            <path d="M10 16h30M14 12l2 8M36 12l-2 8" stroke="var(--color-wood-dark)" stroke-width="1" opacity="0.6" transform="rotate(-3 25 16)" />
          </svg>

          <!-- Fallen palm fronds, resting on the sand -->
          <svg class="prop prop--frond prop--frond-1" viewBox="0 0 60 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M2 14 Q 30 2, 58 10" fill="none" stroke="var(--color-palm-dark)" stroke-width="5" stroke-linecap="round" />
            <path d="M10 13 L 8 6 M20 10 L 19 4 M30 8 L 30 2 M40 8 L 42 3" stroke="var(--color-palm-light)" stroke-width="2" stroke-linecap="round" />
          </svg>
          <svg class="prop prop--frond prop--frond-2" viewBox="0 0 60 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M2 8 Q 30 18, 58 12" fill="none" stroke="var(--color-palm-light)" stroke-width="5" stroke-linecap="round" />
            <path d="M10 9 L 7 16 M22 13 L 21 19 M34 15 L 36 20" stroke="var(--color-palm-dark)" stroke-width="2" stroke-linecap="round" />
          </svg>

          <!-- Vegetation that appears as adventures are finished: the island
               gets greener the further the player gets. Hidden until then. -->
          <div class="growth growth--1">
            <svg viewBox="0 0 60 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <ellipse cx="30" cy="36" rx="24" ry="9" fill="#3A8067" />
              <ellipse cx="17" cy="27" rx="13" ry="11" fill="#4A9478" />
              <ellipse cx="38" cy="24" rx="15" ry="13" fill="#3A8067" />
              <circle cx="12" cy="21" r="3" fill="#FF9F8A" />
              <circle cx="44" cy="16" r="3" fill="#FFB25E" />
            </svg>
          </div>
          <span class="growth-firefly growth-firefly--1"></span>

          <div class="growth growth--2">
            <svg viewBox="0 0 50 46" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M25 44 V22" stroke="#3A8067" stroke-width="3.5" stroke-linecap="round" fill="none" />
              <path d="M13 42 V26 M37 42 V28" stroke="#3A8067" stroke-width="3" stroke-linecap="round" fill="none" />
              <circle cx="25" cy="16" r="7" fill="#FF9F8A" />
              <circle cx="25" cy="16" r="3" fill="#FFE3B0" />
              <circle cx="13" cy="21" r="5.5" fill="#FFB25E" />
              <circle cx="37" cy="23" r="5.5" fill="#F2A0C4" />
            </svg>
          </div>
          <span class="growth-firefly growth-firefly--2"></span>

          <div class="growth growth--3">
            <svg viewBox="0 0 56 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M28 58 Q 26 40, 28 28" stroke="#8A5A3B" stroke-width="5" stroke-linecap="round" fill="none" />
              <path d="M28 28 Q 10 22, 2 32" stroke="#245B4F" stroke-width="5" stroke-linecap="round" fill="none" />
              <path d="M28 28 Q 46 22, 54 32" stroke="#3A8067" stroke-width="5" stroke-linecap="round" fill="none" />
              <path d="M28 28 Q 24 12, 14 6" stroke="#3A8067" stroke-width="5" stroke-linecap="round" fill="none" />
              <path d="M28 28 Q 34 12, 44 8" stroke="#245B4F" stroke-width="5" stroke-linecap="round" fill="none" />
            </svg>
          </div>
          <span class="growth-firefly growth-firefly--3"></span>

          <!-- Paths connecting the boxes, drawn under everything else on land -->
          <svg class="paths" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path class="paths__segment paths__segment--1" id="path-segment-1" d="M 22 78 Q 40 55, 50 62" />
            <path class="paths__segment paths__segment--2" id="path-segment-2" d="M 50 62 Q 60 69, 78 50" />
            <path class="paths__segment paths__segment--3" id="path-segment-3" d="M 78 50 Q 45 80, 8 74" />
          </svg>

          <!-- A short wooden boardwalk laid over a soft patch of the path -->
          <svg class="prop prop--boardwalk" viewBox="0 0 70 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="0" y="4" width="70" height="18" rx="2" fill="var(--color-wood-light)" />
            <line x1="8" y1="4" x2="8" y2="22" stroke="var(--color-wood-dark)" stroke-width="2" />
            <line x1="20" y1="4" x2="20" y2="22" stroke="var(--color-wood-dark)" stroke-width="2" />
            <line x1="32" y1="4" x2="32" y2="22" stroke="var(--color-wood-dark)" stroke-width="2" />
            <line x1="44" y1="4" x2="44" y2="22" stroke="var(--color-wood-dark)" stroke-width="2" />
            <line x1="56" y1="4" x2="56" y2="22" stroke="var(--color-wood-dark)" stroke-width="2" />
            <line x1="68" y1="4" x2="68" y2="22" stroke="var(--color-wood-dark)" stroke-width="2" />
            <rect x="0" y="4" width="70" height="18" rx="2" fill="none" stroke="var(--color-wood-dark)" stroke-width="2" />
          </svg>

          <div class="palm palm--left">
            <svg class="palm__svg" viewBox="0 0 60 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path class="palm__trunk-svg" d="M 32 128 Q 24 90, 30 60 Q 33 40, 26 18" fill="none" stroke="#8A5A3B" stroke-width="9" stroke-linecap="round" />
              <g class="palm__leaves-svg">
                <path d="M 26 18 Q 4 8, -10 24" fill="none" stroke="#245B4F" stroke-width="7" stroke-linecap="round" />
                <path d="M 26 18 Q 8 26, 0 46" fill="none" stroke="#3A8067" stroke-width="7" stroke-linecap="round" />

    <!-- ================= REWARD SCENE (universal) ================= -->
    <section id="scene-reward" class="scene scene--reward" aria-label="Подарунок">

      <!-- A soft, blurred suggestion of the island behind everything —
           not a screenshot of the real scene (out of scope for a
           canvas-free build), just enough hazy shape and color that the
           reward moment reads as "the camera pulled in close on the
           island", not "a UI screen appeared out of nowhere". -->
      <div class="reward-backdrop">
        <svg class="reward-backdrop__art" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="200" cy="260" rx="260" ry="70" fill="#2FA0AE" opacity="0.5" />
          <ellipse cx="120" cy="240" rx="90" ry="30" fill="#3A8067" opacity="0.6" />
          <ellipse cx="260" cy="250" rx="110" ry="26" fill="#3A8067" opacity="0.5" />
          <path d="M100 200 L100 120 Q120 100 140 120 L140 200Z" fill="#2C5C4E" opacity="0.5" />
          <path d="M260 210 L260 130 Q280 108 300 130 L300 210Z" fill="#2C5C4E" opacity="0.4" />
        </svg>
        <div class="reward-backdrop__fog"></div>
      </div>

      <!-- The dark, vignetted cinematic overlay — camera "focusing" on
           the chest. Never a flat black screen: the backdrop above
           always shows through. -->
      <div class="reward-focus-overlay"></div>

      <!-- Small gold particles drifting slowly through the whole scene,
           independent of the chest's own sparkle burst. -->
      <div class="reward-ambient-particles" id="reward-ambient-particles"></div>

      <div class="reward-stage">

        <!-- Step 1: countdown -->
        <div class="reward-countdown" id="reward-countdown"></div>

        <!-- Step 1.5: the ancient symbol this adventure just earned.
             Lives here rather than in each adventure scene: all three
             pass through Reward, so one element and one code path
             covers the whole story thread. -->
        <div class="reward-symbol" id="reward-symbol">
          <svg class="reward-symbol__glyph" viewBox="0 0 28 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path id="reward-symbol-path" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <p class="reward-symbol__name" id="reward-symbol-name"></p>
        </div>

        <!-- Step 2: the chest — the same one they tapped on the island -->
        <button class="reward-box" id="reward-box" aria-label="Відкрити скриню">
          <span class="reward-box__glow-crack reward-box__glow-crack--1"></span>
          <span class="reward-box__glow-crack reward-box__glow-crack--2"></span>
          <span class="reward-box__glow-crack reward-box__glow-crack--3"></span>
          <span class="reward-beam" id="reward-beam"></span>
          <span class="reward-beam reward-beam--side reward-beam--left" id="reward-beam-left"></span>
          <span class="reward-beam reward-beam--side reward-beam--right" id="reward-beam-right"></span>
          <span class="reward-box__art"></span>
          <span class="reward-sparkles" id="reward-sparkles"></span>
        </button>

        <!-- An explicit, unambiguous button for the same action as tapping
             the chest above — belt and suspenders: whichever one actually
             registers the tap, both do exactly the same thing. -->
        <button class="wooden-button reward-open-btn" id="reward-open-btn">Відкрити скриню</button>

        <!-- Step 3: three face-down cards to choose from -->
        <div class="reward-cards" id="reward-cards"></div>

        <!-- Step 4: the reveal of the chosen gift -->
        <div class="reward-reveal" id="reward-reveal">
          <div class="reward-reveal__icon" id="reward-reveal-icon"></div>
          <h2 id="reward-reveal-title"></h2>
          <p id="reward-reveal-message"></p>
          <button class="wooden-button" id="reward-continue">Продовжити пригоду →</button>
        </div>

      </div>
    </section>

    <!-- ================= ALBUM SCENE ================= -->
    <!-- ================= SECRET QUEST: THE FINAL CONSTELLATION ================= -->
    <section id="scene-constellation" class="scene scene--constellation" aria-label="Фінальне сузір'я">

      <!-- The whole scene shifts upward on entry, which reads as the camera
           slowly rising toward the sky while Mickey stays down below. -->
      <div class="cst-world" id="cst-world">

        <div class="cst-sky">
          <!-- Layered depth, all moving at their own slow pace: the
               Milky Way sits furthest back, then small stars, then
               larger ones, then thin cloud, then the moon. The
               constellation itself is the frontmost layer. -->
          <div class="cst-milkyway"></div>
          <div class="cst-moon"></div>
          <div class="cst-cloud cst-cloud--1"></div>
          <div class="cst-cloud cst-cloud--2"></div>

          <!-- ~30 identical small stars, generated by ConstellationScene.js
               so their scatter differs every time. The five that matter
               are added on top of these, at fixed positions. -->
          <div class="cst-starfield" id="cst-starfield"></div>
          <div class="cst-starfield cst-starfield--big" id="cst-starfield-big"></div>

          <!-- A fixed-aspect square box so the constellation keeps its
               shape on any screen — percentages inside here are safe,
               percentages against the raw viewport would skew the star. -->
          <div class="cst-figure" id="cst-figure">
            <svg class="cst-lines" id="cst-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path class="cst-lines__drawn" id="cst-lines-drawn" fill="none" />
              <path class="cst-lines__live" id="cst-lines-live" fill="none" />
            </svg>
            <div class="cst-stars" id="cst-stars"></div>
            <div class="cst-glow" id="cst-glow"></div>
          </div>

          <!-- The soft beam that descends onto the island once the
               constellation is lit. -->
          <div class="cst-beam" id="cst-beam"></div>
        </div>

        <!-- The island below: a dark silhouette, its torches and fireflies
             still going, with Mickey standing in the middle of it. -->
        <div class="cst-island">
          <svg class="cst-island__art" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 120 L0 66 Q60 40 130 52 Q200 30 270 50 Q340 38 400 62 L400 120Z" fill="#0E2A34" />
            <path d="M60 60 L60 20 Q72 8 84 20 L84 60Z" fill="#0A2028" />
            <path d="M310 58 L310 22 Q322 10 334 22 L334 58Z" fill="#0A2028" />
          </svg>
          <span class="cst-firefly cst-firefly--1"></span>
          <span class="cst-firefly cst-firefly--2"></span>
          <span class="cst-firefly cst-firefly--3"></span>
          <div class="cst-mickey-spot" id="cst-mickey-spot"></div>
        </div>
      </div>

      <!-- Bursts once, at the moment the constellation is completed and
           the whole sky wakes up — the one genuinely triumphant beat
           left in an otherwise deliberately calm ending. -->
      <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>

      <!-- The legend, typed in before the sky work begins -->
      <div class="cst-legend dialog--hidden" id="cst-legend">
        <p class="cst-legend__text" id="cst-legend-text"></p>
      </div>
    </section>

    <section id="scene-album" class="scene scene--album" aria-label="Подорож завершено">

      <!-- The island is still alive behind the journal — this scene is
           never a static end-card. Waves move, stars twinkle, fireflies
           drift, torches flicker, the ship rocks, and now and then a
           star falls. -->
      <div class="album-world">
        <div class="album-sky">
          <div class="album-starfield" id="album-starfield"></div>
          <div class="album-moon"></div>
          <div class="album-shooting-star" id="album-shooting-star"></div>
        </div>

        <div class="album-sea">
          <div class="album-moonpath"></div>
          <span class="album-wave album-wave--1"></span>
          <span class="album-wave album-wave--2"></span>
          <svg class="album-ship" viewBox="0 0 40 26" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M4 16 L36 16 L31 23 L9 23 Z" fill="#123040" />
            <line x1="20" y1="2" x2="20" y2="16" stroke="#123040" stroke-width="1.6" />
            <path d="M20 3 L30 13 L20 13 Z" fill="#1B4358" />
          </svg>
        </div>

        <div class="album-land">
          <svg class="album-land__art" viewBox="0 0 400 110" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 110 L0 58 Q70 32 140 46 Q210 24 280 44 Q345 34 400 56 L400 110Z" fill="#0F2C36" />
          </svg>
          <svg class="album-palm album-palm--1" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M20 70 Q17 45 20 24" stroke="#0A2028" stroke-width="4" fill="none" stroke-linecap="round" />
            <path d="M20 24 Q6 16 0 24 M20 24 Q34 16 40 24 M20 24 Q14 8 22 2" stroke="#0A2028" stroke-width="4" fill="none" stroke-linecap="round" />
          </svg>
          <svg class="album-palm album-palm--2" viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M20 70 Q23 45 20 24" stroke="#0A2028" stroke-width="4" fill="none" stroke-linecap="round" />
            <path d="M20 24 Q6 16 0 24 M20 24 Q34 16 40 24 M20 24 Q26 8 18 2" stroke="#0A2028" stroke-width="4" fill="none" stroke-linecap="round" />
          </svg>
          <span class="album-torch album-torch--1"></span>
          <span class="album-torch album-torch--2"></span>
          <span class="album-firefly album-firefly--1"></span>
          <span class="album-firefly album-firefly--2"></span>
          <span class="album-firefly album-firefly--3"></span>
          <div class="album-fog"></div>
          <div class="album-mickey-spot" id="album-mickey-spot"></div>
        </div>
      </div>

      <!-- The journal itself, opening onto the closing page -->
      <div class="album-journal" id="album-journal">

        <!-- Mickey's compass, set down beside the journal while he
             writes — the same one that pointed at the constellation. -->
        <svg class="album-compass" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="22" cy="22" r="19" fill="#D9A24B" stroke="#8A5A3B" stroke-width="2.5" />
          <circle cx="22" cy="22" r="13" fill="var(--color-starlight)" stroke="#B8894F" stroke-width="1.5" />
          <path class="album-compass__needle" d="M22 11 L25 22 L22 33 L19 22 Z" fill="#E8734A" />
          <circle cx="22" cy="22" r="2" fill="#8A5A3B" />
        </svg>

        <div class="album-journal__page">
          <h1 class="album-journal__title" id="album-journal-title"></h1>
          <p class="album-journal__subtitle" id="album-journal-subtitle"></p>
          <div class="album-journal__rule"></div>
          <p class="album-journal__tagline" id="album-journal-tagline"></p>

          <!-- Polaroids of the journey, dropped onto the page one by one -->
          <div class="album-photos" id="album-photos"></div>

          <div class="album-letter" id="album-letter"></div>

          <button class="wooden-button album-continue" id="album-continue"></button>
        </div>
      </div>
    </section>


    <!-- ================= FINALE SCENE ================= -->
    <!-- The little scene after the screen has already gone dark -->
    <section id="scene-finale" class="scene scene--finale" aria-label="Фінал">

      <!-- The night island one last time, small and far away -->
      <div class="finale-world" id="finale-world">
        <div class="finale-starfield" id="finale-starfield"></div>

        <!-- The same constellation the player drew, flaring once in the sky -->
        <svg class="finale-constellation" id="finale-constellation" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M 50 8 L 74.7 84 L 10.1 37 L 89.9 37 L 25.3 84 L 50 8"
                fill="none" stroke="var(--color-box-glow)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="50" cy="8" r="1.6" fill="var(--color-box-glow)" />
          <circle cx="89.9" cy="37" r="1.6" fill="var(--color-box-glow)" />
          <circle cx="74.7" cy="84" r="1.6" fill="var(--color-box-glow)" />
          <circle cx="25.3" cy="84" r="1.6" fill="var(--color-box-glow)" />
          <circle cx="10.1" cy="37" r="1.6" fill="var(--color-box-glow)" />
        </svg>

        <div class="finale-sea">
          <span class="finale-wave finale-wave--1"></span>
          <span class="finale-wave finale-wave--2"></span>
        </div>

        <div class="finale-island">
          <svg class="finale-island__art" viewBox="0 0 200 50" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 50 L0 30 Q40 16 80 24 Q120 12 160 22 Q182 18 200 28 L200 50Z" fill="#0A1E28" />
          </svg>
          <div id="finale-mickey" class="mickey mickey--wave finale-mickey"></div>
        </div>
      </div>

      <p class="finale-last-line" id="finale-last-line"></p>
    </section>

    <!-- ============ OPENING SEQUENCE OVERLAY ============ -->
    <!-- Not a scene: the intro plays ON the island (real camera, real Mickey, -->
    <!-- real boxes growing). This layer only holds what sits on top of it. -->
    <div id="intro" class="intro">

      <!-- Dawn veil: starts almost black, lifts as the world "wakes up" -->
      <div class="intro__veil" id="intro-veil"></div>

      <p class="intro__caption" id="intro-caption"></p>

      <!-- The title card: a proper "movie title" beat before anything is
           interactive. Tapping the button is also the deliberate first
           gesture that unlocks audio — cleaner than listening for just
           any tap on the page. -->
      <div class="intro__titlecard" id="intro-titlecard">
        <div class="titlecard">
          <h1 class="titlecard__logo">Secret Island</h1>
          <svg class="titlecard__flourish" viewBox="0 0 160 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M4 10 Q 40 2, 80 10 T 156 10" fill="none" stroke="#FFE9A8" stroke-width="2.5" stroke-linecap="round" />
          </svg>
          <p class="titlecard__tagline">Маленька пригода з Mickey</p>
          <button class="wooden-button is-visible" id="intro-start-btn">Почати</button>
        </div>
      </div>

      <!-- Explorer registration, on a parchment scroll -->
      <div class="intro__scroll" id="intro-scroll">
        <div class="scroll">
          <span class="scroll__roll scroll__roll--top"></span>

          <div class="scroll__body">
            <h2 class="scroll__title" id="scroll-title"></h2>

            <input
              class="scroll__input"
              id="team-name-input"
              type="text"
              maxlength="22"
              autocomplete="off"
              aria-label="Назва команди" />

            <p class="scroll__registered" id="scroll-registered"></p>

            <!-- Gold stamp, thumped down once the name is confirmed -->
            <div class="stamp" id="stamp">
              <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="60" cy="60" r="54" fill="none" stroke="#C9A227" stroke-width="5" />
                <circle cx="60" cy="60" r="45" fill="none" stroke="#C9A227" stroke-width="2" />
                <text id="stamp-text" x="60" y="66" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.5" fill="#C9A227"></text>
              </svg>
            </div>
          </div>

          <span class="scroll__roll scroll__roll--bottom"></span>
        </div>

        <!-- Wooden sign button; only appears once a name has been typed -->
        <button class="wooden-button" id="start-adventure">
          <span id="start-adventure-label"></span>
        </button>
      </div>
    </div>

    <!-- Sound toggle. Sits above every scene, like the speech bubble. -->
    <button id="mute-toggle" class="mute-toggle" aria-label="Звук">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4 9h4l5-4v14l-5-4H4z" fill="#5A3A22" />
        <path class="mute-toggle__waves" d="M16 9.5a4 4 0 010 5M18.5 7a7.5 7.5 0 010 10"
              fill="none" stroke="#5A3A22" stroke-width="2" stroke-linecap="round" />
        <path class="mute-toggle__cross" d="M16 9.5l6 5M22 9.5l-6 5"
              fill="none" stroke="#5A3A22" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <!-- Mickey's speech bubble: global, sits above every scene so his lines -->
    <!-- stay visible no matter which scene is currently active. -->
    <div id="mickey-dialog" class="dialog dialog--hidden">
      <p id="mickey-dialog-text"></p>
    </div>

  </div>

  <!-- lottie-web renders the gift animations. It's the project's only
       external runtime dependency; everything else is hand-written. If
       the CDN is ever unreachable the game still works — RewardScene
       falls back to the original drawn icons (see _playGiftAnimation). -->
  <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
